# docker-compose.yml — local deployment of the application + PostgreSQL database
#
# Prerequisites:
#   1. Build the Spring Boot JAR first:   make jar
#   2. Optionally create a .env file to override default credentials (see below).
#
# Usage:
#   docker compose up          # start all services (detached: add -d)
#   docker compose stop        # stop containers (data is preserved)
#   docker compose start       # restart stopped containers
#   docker compose down        # stop and remove containers
#   docker compose down -v     # also remove the postgres data volume
#
# Credential overrides (create a .env file in this directory):
#   DB_NAME=ods_api_service
#   DB_USERNAME=ods_api_service
#   DB_PASSWORD=changeme
#
# The application is exposed on http://localhost:8080
# Swagger UI: http://localhost:8080/swagger-ui/index.html

services:

  # ─────────────────────────────────────────────
  # PostgreSQL database
  # ─────────────────────────────────────────────
  postgres:
    build:
      context: ../ods-core/ods-api-service/docker
      dockerfile: Dockerfile.database
    environment:
      POSTGRES_DB: ${DB_NAME:-ods_api_service}
      POSTGRES_USER: ${DB_USERNAME:-ods_api_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ods_api_service}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ods_api_service} -d ${DB_NAME:-ods_api_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # pgAdmin (PostgreSQL web UI)
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ods.example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Application
  # ─────────────────────────────────────────────
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ods_api_service}
      DB_USERNAME: ${DB_USERNAME:-ods_api_service}
      DB_PASSWORD: ${DB_PASSWORD:-ods_api_service}
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
